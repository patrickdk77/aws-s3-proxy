name: Publish Docker images

on:
  push:
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  main:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - image_name: aws-s3-proxy
            build_target: dist
          - image_name: aws-s3-proxy-lambda
            build_target: dist-lambda
      fail-fast: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_name
        run: |
          value=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          echo "value=$value" >> $GITHUB_OUTPUT
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image_name.outputs.value }}
      - id: build_date
        name: Determine build date
        run: |
          value=$(date -u +'%Y-%m-%dT%H:%M:%Sz')
          echo "value=$value" >> $GITHUB_OUTPUT
      - id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ matrix.build_target }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
            BUILD_REF=${{ github.sha }}
      - uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.image_name.outputs.value }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
